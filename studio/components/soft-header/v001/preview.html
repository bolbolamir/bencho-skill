<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>

</head><body><script src="/assets/lucide.js"></script><div id="forma-header-preview" class="viz-dotted-background">
  <style>
    #forma-header-preview {

      --fh-shadow: light-dark(rgb(23 24 26 / .09), rgb(0 0 0 / .3));
      --fh-scrim: light-dark(rgb(247 247 246 / .48), rgb(10 10 10 / .5));
      --fh-green: light-dark(#24724a, #68b98b);
      --fh-amber: light-dark(#e8b46a, #dcac6c);
      --fh-amber-ink: #362719;

      --fh-avatar-b: #6a7ed6;

      --fh-mint-a: #c2d6ba;
      --fh-mint-b: #75a48b;
      --fh-mint-c: #ecdaa7;
      --fh-mint-ink: #263b31;
      --fh-peach-a: #edb69c;

      --fh-modal-radius: 26px;
      color: var(--fh-ink);
      position: relative;
      isolation: isolate;
    }
    #forma-header-preview .fh-app,
    #forma-header-preview .fh-app * { box-sizing: border-box; }

      padding: 32px 16px;

    #forma-header-preview[data-expanded="true"] .fh-app { min-height: 566px; }
    #forma-header-preview .fh-app :where(button, input) { font: inherit; }

      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #forma-header-preview .fh-app [hidden] { display: none !important; }
    #forma-header-preview .fh-app h2,

      align-items: center;
      padding: 4px 8px 4px 4px;

    }

      width: 36px;

    #forma-header-preview .fh-mark svg { width: 22px; height: 22px; stroke-width: 1.7; }

    }
    #forma-header-preview .fh-bell:hover { background: var(--fh-wash); }

    #forma-header-preview .fh-bell:hover > svg { animation: fh-bell-ring 620ms ease both; }

      display: grid;
      place-items: center;

    }
    #forma-header-preview .fh-avatar[data-tone="peach"] {
      color: var(--fh-peach-ink);
      background: radial-gradient(ellipse at 22% 18%, var(--fh-peach-a), transparent 60%), radial-gradient(ellipse at 80% 85%, var(--fh-peach-c), transparent 65%), var(--fh-peach-b);
    }
    #forma-header-preview .fh-profile-trigger:hover .fh-avatar { transform: scale(1.055); }
    #forma-header-preview .fh-profile-name { font-size: 13px; font-weight: 500; max-width: 110px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    #forma-header-preview .fh-profile-chevron { width: 13px; height: 13px; color: var(--fh-secondary); transition: transform 300ms var(--fh-arrive); }

    #forma-header-preview .fh-modal::backdrop { background: var(--fh-scrim); backdrop-filter: blur(3px); }

    #forma-header-preview .fh-workspace-symbol { height: 36px; width: 36px; border-radius: 12px; display: grid; place-items: center; background: var(--fh-surface); box-shadow: 0 0 0 1px var(--fh-line); flex: none; }
    #forma-header-preview .fh-workspace-symbol svg { width: 18px; height: 18px; stroke-width: 1.6; }

    #forma-header-preview .fh-primary {

      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 42px;

      padding: 10px 18px;
      border: 0;
      border-radius: 999px;
      background: var(--fh-ink);
      color: var(--fh-inverse);
      font-size: 13px;
      font-weight: 500;
      transition: transform 220ms var(--fh-arrive), opacity 160ms;

    #forma-header-preview .fh-primary > svg { height: 16px; width: 16px; transition: transform 300ms var(--fh-arrive); }
    #forma-header-preview .fh-primary:hover { transform: scale(.98); }

    #forma-header-preview .fh-primary:active { transform: scale(.955); }

    #forma-header-preview .fh-avatar-large { width: 52px; height: 52px; font-size: 15px; }

    #forma-header-preview .fh-field { display: grid; gap: 7px; margin-bottom: 15px; }

    }
    #forma-header-preview .fh-input:hover { background: var(--fh-hover); }
    #forma-header-preview .fh-input:focus { border-color: var(--fh-secondary); background: var(--fh-surface); }
    #forma-header-preview .fh-color-row { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 22px; }
    #forma-header-preview .fh-color-options { display: flex; align-items: center; gap: 7px; border: 0; margin: 0; padding: 0; }

    #forma-header-preview .fh-color-option input { appearance: none; position: absolute; width: 28px; height: 28px; margin: 0; inset: 0; border: 1px solid transparent; border-radius: 50%; transition: border-color 180ms, transform 250ms var(--fh-give); }

    #forma-header-preview .fh-notification:hover { background: var(--fh-wash); }

  <div class="fh-app" aria-label="Forma header preview">

        <span class="fh-brand-copy"><span class="fh-wordmark">forma</span><span class="fh-workspace" data-workspace-label>Personal</span></span>
        <i class="fh-brand-chevron" data-lucide="chevrons-up-down" aria-hidden="true"></i>
      </button>
      <div class="fh-actions">
        <button class="fh-bell cursor-interaction" type="button" data-open-panel="notifications" aria-label="Open notifications modal, 3 unread" aria-haspopup="dialog" aria-controls="fh-notifications-dialog" aria-expanded="false" data-tooltip="Notifications">
          <i data-lucide="bell" aria-hidden="true"></i><span class="fh-count" aria-hidden="true" data-unread-count>3</span>
        </button>
        <span class="fh-divider" aria-hidden="true"></span>
        <button class="fh-profile-trigger cursor-interaction" type="button" data-open-panel="profile" aria-label="Open profile modal" aria-haspopup="dialog" aria-controls="fh-profile-dialog" aria-expanded="false" data-tooltip="Your profile">
          <span class="fh-avatar" data-profile-avatar data-tone="lilac" aria-hidden="true">A</span>
          <span class="fh-profile-name" data-profile-name>Amir</span>
          <i class="fh-profile-chevron" data-lucide="chevron-down" aria-hidden="true"></i>
        </button>
      </div>
    </header>

    <dialog class="fh-modal" id="fh-workspace-dialog" data-panel="workspace" aria-labelledby="fh-workspace-title">
      <div class="fh-modal-head">
        <div><h2 id="fh-workspace-title">Your workspace</h2><p class="fh-sub">A space for whatever comes next.</p></div>
        <button class="fh-close cursor-interaction" type="button" data-close-panel aria-label="Close workspace modal"><i data-lucide="x" aria-hidden="true"></i></button>
      </div>
      <form data-workspace-form>
        <div class="fh-workspaces" role="radiogroup" aria-label="Choose a workspace">
          <label class="fh-workspace-option fh-stagger cursor-interaction">
            <input class="cursor-interaction" type="radio" name="fh-workspace" value="Personal" aria-label="Personal workspace" checked>
            <span class="fh-workspace-symbol"><i data-lucide="user-round" aria-hidden="true"></i></span>
            <span class="fh-row-copy"><span class="fh-row-title">Personal</span><span class="fh-row-detail">Just you and your ideas</span></span>
            <i class="fh-option-check" data-lucide="check" aria-hidden="true"></i>
          </label>
          <label class="fh-workspace-option fh-stagger cursor-interaction">
            <input class="cursor-interaction" type="radio" name="fh-workspace" value="Design studio" aria-label="Design studio workspace">
            <span class="fh-workspace-symbol"><i data-lucide="layers-2" aria-hidden="true"></i></span>
            <span class="fh-row-copy"><span class="fh-row-title">Design studio</span><span class="fh-row-detail">A place to make things together</span></span>
            <i class="fh-option-check" data-lucide="check" aria-hidden="true"></i>
          </label>
          <label class="fh-workspace-option fh-stagger cursor-interaction">
            <input class="cursor-interaction" type="radio" name="fh-workspace" value="Side projects" aria-label="Side projects workspace">
            <span class="fh-workspace-symbol"><i data-lucide="shapes" aria-hidden="true"></i></span>
            <span class="fh-row-copy"><span class="fh-row-title">Side projects</span><span class="fh-row-detail">Room to try something new</span></span>
            <i class="fh-option-check" data-lucide="check" aria-hidden="true"></i>
          </label>
        </div>
        <button class="fh-primary cursor-interaction fh-stagger" type="button" data-save-workspace>Open workspace<i data-lucide="arrow-right" aria-hidden="true"></i></button>
      </form>
    </dialog>

    <dialog class="fh-modal" id="fh-notifications-dialog" data-panel="notifications" aria-labelledby="fh-notifications-title">
      <div class="fh-modal-head">
        <div><h2 id="fh-notifications-title">Notifications</h2><p class="fh-sub" data-notifications-subtitle>3 unread updates</p></div>
        <button class="fh-close cursor-interaction" type="button" data-close-panel aria-label="Close notifications modal"><i data-lucide="x" aria-hidden="true"></i></button>
      </div>
      <div class="fh-tabs" role="group" aria-label="Filter notifications" data-current="all">
        <button class="fh-tab cursor-interaction" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="fh-tab cursor-interaction" type="button" data-filter="unread" aria-pressed="false">Unread</button>
      </div>
      <div class="fh-notification-list" aria-label="Notifications">
        <button class="fh-notification fh-stagger cursor-interaction" type="button" data-note="comment" data-read="false" aria-label="Mark Mara's comment as read">
          <span class="fh-note-icon"><i data-lucide="message-circle" aria-hidden="true"></i></span>
          <span class="fh-note-copy"><span class="fh-note-top"><span class="fh-note-title">Mara left a comment</span><time>2m</time></span><span class="fh-note-detail">“The new header feels so much better.”</span></span>
          <span class="fh-note-unread" aria-hidden="true"></span>
        </button>
        <button class="fh-notification fh-stagger cursor-interaction" type="button" data-note="export" data-read="false" aria-label="Mark export notification as read">
          <span class="fh-note-icon"><i data-lucide="download" aria-hidden="true"></i></span>
          <span class="fh-note-copy"><span class="fh-note-top"><span class="fh-note-title">Your export is ready</span><time>18m</time></span><span class="fh-note-detail">Landing page · PNG</span></span>
          <span class="fh-note-unread" aria-hidden="true"></span>
        </button>
        <button class="fh-notification fh-stagger cursor-interaction" type="button" data-note="invite" data-read="false" aria-label="Mark workspace invitation as read">
          <span class="fh-note-icon"><i data-lucide="users-round" aria-hidden="true"></i></span>
          <span class="fh-note-copy"><span class="fh-note-top"><span class="fh-note-title">A little more company</span><time>1h</time></span><span class="fh-note-detail">Priya invited you to Design studio.</span></span>
          <span class="fh-note-unread" aria-hidden="true"></span>
        </button>
      </div>
      <div class="fh-empty" data-notification-empty hidden><i data-lucide="circle-check" aria-hidden="true"></i><span>All caught up</span></div>
      <div class="fh-note-footer">
        <button class="fh-quiet cursor-interaction" type="button" role="switch" aria-checked="false" aria-label="Quiet mode" data-quiet><span class="fh-switch-track" aria-hidden="true"><span class="fh-switch-thumb"></span></span>Quiet mode</button>
        <button class="fh-read-all cursor-interaction" type="button" data-read-all>Mark all read</button>
      </div>
      <span class="fh-live" role="status" aria-live="polite" data-note-announcement></span>
    </dialog>

    <dialog class="fh-modal" id="fh-profile-dialog" data-panel="profile" aria-labelledby="fh-profile-title">
      <div class="fh-modal-head">
        <div><h2 id="fh-profile-title">Your profile</h2><p class="fh-sub">Make yourself at home.</p></div>
        <button class="fh-close cursor-interaction" type="button" data-close-panel aria-label="Close profile modal"><i data-lucide="x" aria-hidden="true"></i></button>
      </div>
      <form data-profile-form>
        <div class="fh-profile-hero fh-stagger">
          <span class="fh-avatar fh-avatar-large" data-edit-avatar data-tone="lilac" aria-hidden="true">A</span>
          <div><span class="fh-row-title" data-edit-name>Amir</span><span class="fh-online">Available</span></div>
        </div>
        <label class="fh-field fh-stagger"><span class="fh-label">Display name</span><input class="fh-input" type="text" name="displayName" value="Amir" maxlength="28" autocomplete="off" required></label>
        <label class="fh-field fh-stagger"><span class="fh-label">What you do</span><input class="fh-input" type="text" name="profileRole" value="Designer & builder" maxlength="50" autocomplete="off"></label>
        <div class="fh-color-row fh-stagger">
          <span class="fh-label" id="fh-avatar-color-label">Avatar color</span>
          <fieldset class="fh-color-options" aria-labelledby="fh-avatar-color-label">
            <label class="fh-color-option cursor-interaction"><span class="fh-avatar" data-tone="lilac" aria-hidden="true"></span><input class="cursor-interaction" type="radio" name="avatarTone" value="lilac" aria-label="Lilac avatar" checked></label>
            <label class="fh-color-option cursor-interaction"><span class="fh-avatar" data-tone="mint" aria-hidden="true"></span><input class="cursor-interaction" type="radio" name="avatarTone" value="mint" aria-label="Mint avatar"></label>
            <label class="fh-color-option cursor-interaction"><span class="fh-avatar" data-tone="peach" aria-hidden="true"></span><input class="cursor-interaction" type="radio" name="avatarTone" value="peach" aria-label="Peach avatar"></label>
          </fieldset>
        </div>
        <button class="fh-primary cursor-interaction fh-stagger" type="button" data-save-profile>Save changes<i data-lucide="check" aria-hidden="true"></i></button>
      </form>
    </dialog>

    <div class="fh-feedback" data-feedback hidden><div class="fh-feedback-inner"><i data-lucide="check" aria-hidden="true"></i><span data-feedback-text></span></div></div>
    <span class="fh-live" role="status" aria-live="polite" data-announcement></span>
  </div>
  <script>
    (() => {
      const root = document.getElementById('forma-header-preview');
      const bar = root.querySelector('.fh-bar');
      const dialogs = Object.fromEntries(Array.from(root.querySelectorAll('dialog[data-panel]')).map(el => [el.dataset.panel, el]));
      const triggers = Array.from(root.querySelectorAll('[data-open-panel]'));
      const noteIds = ['comment', 'export', 'invite'];
      const workspaceNames = ['Personal', 'Design studio', 'Side projects'];
      const tones = ['lilac', 'mint', 'peach'];
      const state = { workspace: 'Personal', name: 'Amir', role: 'Designer & builder', tone: 'lilac', read: [], quiet: false, filter: 'all' };
      const design = { corner: 22, compact: false, motion: true };
      const media = window.matchMedia('(prefers-reduced-motion: reduce)');
      let current = null;
      let lastTrigger = null;
      let closing = false;
      let toastTimer;
      const profileForm = root.querySelector('[data-profile-form]');
      const workspaceForm = root.querySelector('[data-workspace-form]');
      const announcement = root.querySelector('[data-announcement]');
      const reduced = () => media.matches || !design.motion;
      const initials = value => value.trim().split(/\s+/).filter(Boolean).slice(0, 2).map(part => Array.from(part)[0]).join('').toUpperCase() || 'A';

      function applySaved(snapshot) {
        const saved = snapshot && snapshot.privateContent;
        if (!saved || typeof saved !== 'object') return;
        if (workspaceNames.includes(saved.workspace)) state.workspace = saved.workspace;
        if (typeof saved.name === 'string' && saved.name.trim()) state.name = saved.name.slice(0, 28);
        if (typeof saved.role === 'string') state.role = saved.role.slice(0, 50);
        if (tones.includes(saved.tone)) state.tone = saved.tone;
        if (Array.isArray(saved.read)) state.read = saved.read.filter(id => noteIds.includes(id));
        if (typeof saved.quiet === 'boolean') state.quiet = saved.quiet;
        if (saved.filter === 'all' || saved.filter === 'unread') state.filter = saved.filter;
      }

      function persist() {
        if (!window.openai || !window.openai.setWidgetState) return;
        window.openai.setWidgetState({
          modelContent: { workspace: state.workspace, profileName: state.name, unreadNotifications: noteIds.length - state.read.length, quietMode: state.quiet },
          privateContent: { ...state }
        }).catch(() => {});
      }

      function render() {
        root.querySelector('[data-workspace-label]').textContent = state.workspace;
        root.querySelector('[data-profile-name]').textContent = state.name;
        const avatar = root.querySelector('[data-profile-avatar]');
        avatar.textContent = initials(state.name);
        avatar.dataset.tone = state.tone;
        const count = noteIds.length - state.read.length;
        const countEl = root.querySelector('[data-unread-count]');
        countEl.textContent = String(count);
        countEl.hidden = count === 0;
        const bell = root.querySelector('.fh-bell');
        bell.setAttribute('aria-label', `Open notifications modal, ${count} unread`);
        bell.dataset.tooltip = state.quiet ? 'Notifications · quiet mode' : 'Notifications';
        root.querySelector('[data-notifications-subtitle]').textContent = count ? `${count} unread update${count === 1 ? '' : 's'}` : 'You’re all caught up.';
        const rows = Array.from(root.querySelectorAll('[data-note]'));
        rows.forEach(row => {
          const read = state.read.includes(row.dataset.note);
          row.dataset.read = String(read);
          row.hidden = state.filter === 'unread' && read;
          const title = row.querySelector('.fh-note-title').textContent;
          row.setAttribute('aria-label', read ? `${title}, read. Mark as unread` : `${title}, unread. Mark as read`);
        });
        const empty = rows.every(row => row.hidden);
        root.querySelector('[data-notification-empty]').hidden = !empty;
        root.querySelector('.fh-notification-list').hidden = empty;
        root.querySelector('[data-read-all]').disabled = count === 0;
        root.querySelector('[data-quiet]').setAttribute('aria-checked', String(state.quiet));
        root.querySelector('.fh-tabs').dataset.current = state.filter;
        root.querySelectorAll('[data-filter]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.filter === state.filter)));
      }

      function placeDialog() {
        if (!current || !lastTrigger) return;
        const dialog = dialogs[current];
        const anchor = lastTrigger.getBoundingClientRect();
        const header = bar.getBoundingClientRect();
        const margin = window.innerWidth < 420 ? 12 : 16;
        const width = Math.min(current === 'notifications' ? 388 : 356, window.innerWidth - margin * 2);
        const preferred = current === 'workspace' ? anchor.left : anchor.right - width;
        const left = Math.max(margin, Math.min(preferred, window.innerWidth - width - margin));
        dialog.style.left = `${left + window.scrollX}px`;
        dialog.style.top = `${header.bottom + 12 + window.scrollY}px`;
        dialog.style.transformOrigin = `${Math.max(20, Math.min(width - 20, anchor.left + anchor.width / 2 - left))}px 0px`;
      }

      function toast(message) {
        clearTimeout(toastTimer);
        const box = root.querySelector('[data-feedback]');
        box.querySelector('[data-feedback-text]').textContent = message;
        box.hidden = false;
        announcement.textContent = message;
        if (!reduced()) box.animate([{ opacity: 0, translate: '0 6px', scale: '.97' }, { opacity: 1, translate: '0 0', scale: '1' }], { duration: 340, easing: 'cubic-bezier(.22,1,.36,1)' });
        toastTimer = setTimeout(() => { box.hidden = true; }, 2400);
      }

      function openPanel(name, trigger) {
        if (!dialogs[name] || closing) return;
        if (current) dialogs[current].close();
        root.querySelector('[data-feedback]').hidden = true;
        lastTrigger = trigger;
        current = name;
        root.dataset.expanded = 'true';
        triggers.forEach(button => button.setAttribute('aria-expanded', String(button === trigger)));
        if (name === 'profile') {
          profileForm.elements.displayName.value = state.name;
          profileForm.elements.profileRole.value = state.role;
          profileForm.elements.avatarTone.value = state.tone;
          renderProfileDraft();
        }
        if (name === 'workspace') workspaceForm.elements['fh-workspace'].value = state.workspace;
        const dialog = dialogs[name];
        placeDialog();
        dialog.showModal();
        placeDialog();
        if (!reduced()) {
          dialog.animate([
            { opacity: 0, transform: 'translateY(-12px) scale(.88)', filter: 'blur(3px)' },
            { opacity: 1, transform: 'translateY(0) scale(1)', filter: 'blur(0)' }
          ], { duration: 440, easing: 'cubic-bezier(.24,1.12,.38,1)' });
          dialog.querySelectorAll('.fh-stagger').forEach((element, index) => element.animate([
            { opacity: 0, transform: 'translateY(7px)' },
            { opacity: 1, transform: 'translateY(0)' }
          ], { duration: 320, delay: 50 + index * 27, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'backwards' }));
        }
      }

      async function closePanel(message) {
        if (!current || closing) return;
        closing = true;
        const dialog = dialogs[current];
        if (!reduced()) {
          try { await dialog.animate([{ opacity: 1, transform: 'translateY(0) scale(1)' }, { opacity: 0, transform: 'translateY(-7px) scale(.965)' }], { duration: 155, easing: 'ease-in', fill: 'forwards' }).finished; } catch (_) {}
        }
        dialog.close();
        dialog.getAnimations().forEach(animation => animation.cancel());
        current = null;
        closing = false;
        root.dataset.expanded = 'false';
        triggers.forEach(button => button.setAttribute('aria-expanded', 'false'));
        if (lastTrigger) lastTrigger.focus({ preventScroll: true });
        if (message) toast(message);
      }

      function renderProfileDraft() {
        const name = profileForm.elements.displayName.value || state.name;
        root.querySelector('[data-edit-name]').textContent = name;
        const avatar = root.querySelector('[data-edit-avatar]');
        avatar.textContent = initials(name);
        avatar.dataset.tone = profileForm.elements.avatarTone.value || state.tone;
      }

      triggers.forEach(button => button.addEventListener('click', () => openPanel(button.dataset.openPanel, button)));
      root.querySelectorAll('[data-close-panel]').forEach(button => button.addEventListener('click', () => closePanel()));
      Object.values(dialogs).forEach(dialog => {
        dialog.addEventListener('cancel', event => { event.preventDefault(); closePanel(); });
        dialog.addEventListener('click', event => {
          if (event.target !== dialog) return;
          const rect = dialog.getBoundingClientRect();
          if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) closePanel();
        });
      });
      function saveWorkspace() {
        const chosen = workspaceForm.elements['fh-workspace'].value;
        state.workspace = workspaceNames.includes(chosen) ? chosen : 'Personal';
        render(); persist(); closePanel(`Switched to ${state.workspace}`);
      }
      workspaceForm.addEventListener('submit', event => { event.preventDefault(); saveWorkspace(); });
      root.querySelector('[data-save-workspace]').addEventListener('click', saveWorkspace);
      workspaceForm.addEventListener('keydown', event => {
        if (event.key === 'Enter') { event.preventDefault(); saveWorkspace(); }
      });
      profileForm.addEventListener('input', renderProfileDraft);
      profileForm.addEventListener('change', renderProfileDraft);
      function saveProfile() {
        if (!profileForm.reportValidity()) return;
        const name = profileForm.elements.displayName.value.trim();
        if (!name) { profileForm.elements.displayName.focus(); return; }
        state.name = name;
        state.role = profileForm.elements.profileRole.value.trim();
        state.tone = profileForm.elements.avatarTone.value;
        render(); persist(); closePanel('Profile updated');
      }
      profileForm.addEventListener('submit', event => { event.preventDefault(); saveProfile(); });
      root.querySelector('[data-save-profile]').addEventListener('click', saveProfile);
      profileForm.addEventListener('keydown', event => {
        if (event.key === 'Enter') { event.preventDefault(); saveProfile(); }
      });
      root.querySelectorAll('[data-note]').forEach(button => button.addEventListener('click', () => {
        const id = button.dataset.note;
        state.read = state.read.includes(id) ? state.read.filter(value => value !== id) : [...state.read, id];
        render(); persist();
        root.querySelector('[data-note-announcement]').textContent = `${noteIds.length - state.read.length} unread notifications`;
        if (button.hidden) {
          const next = root.querySelector('[data-note]:not([hidden])') || root.querySelector('[data-filter="unread"]');
          next.focus({ preventScroll: true });
        }
      }));
      root.querySelector('[data-read-all]').addEventListener('click', () => {
        state.read = [...noteIds]; render(); persist();
        root.querySelector('[data-note-announcement]').textContent = 'All notifications marked as read';
        root.querySelector(`[data-filter="${state.filter}"]`).focus({ preventScroll: true });
      });
      root.querySelectorAll('[data-filter]').forEach(button => button.addEventListener('click', () => { state.filter = button.dataset.filter; render(); persist(); }));
      root.querySelector('[data-quiet]').addEventListener('click', () => {
        state.quiet = !state.quiet; render(); persist();
        root.querySelector('[data-note-announcement]').textContent = state.quiet ? 'Quiet mode on' : 'Quiet mode off';
      });
      window.addEventListener('resize', placeDialog);
      window.addEventListener('openai:set_globals', event => {
        const snapshot = event.detail && event.detail.globals && event.detail.globals.widgetState;
        if (snapshot) { applySaved(snapshot); render(); }
      });
      applySaved(window.openai && window.openai.widgetState);
      render();
      if (globalThis.Tweak) {
        const applyDesign = () => {
          root.style.setProperty('--fh-bar-radius', `${design.corner}px`);
          root.dataset.compact = String(design.compact);
          root.dataset.motion = design.motion ? 'on' : 'off';
          placeDialog();
        };
        const tweak = new Tweak({ container: bar, onChange: applyDesign });
        tweak.addSlider(design, 'corner', { label: 'Corner radius', min: 14, max: 32, unit: 'px' });
        tweak.addToggle(design, 'compact', { label: 'Compact spacing' });
        tweak.addToggle(design, 'motion', { label: 'Soft motion' });
      }
    })();
  </script>
</div>

<script>if(window.lucide)lucide.createIcons({attrs:{width:18,height:18}});</script>
</body></html>
